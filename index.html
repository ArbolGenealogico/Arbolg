<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a22">
  <title>Árbol genealógico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f0f0f0;
      --muted: #a7a7a7;
      --surface: #242424;
      --surface-2: #303030;
      --line: #454545;
      --teal: #72d6c1;
      --coral: #f0a179;
      --rose: #ee8baf;
      --blue: #70aee5;
      --gold: #dfc16e;
      --danger: #ff9a8b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      width: 100%;
      min-height: 100vh;
      color: var(--ink);
      background: #1b1b1b;
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }
    button, input { font: inherit; }
    button {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 16px;
      color: var(--ink);
      background: var(--surface-2);
      cursor: pointer;
      transition: border-color .15s, background .15s, transform .15s;
    }
    button:hover { border-color: var(--teal); background: #3a3a3a; }
    button:active { transform: translateY(1px); }
    button.primary { color: #0e201f; border-color: var(--teal); background: var(--teal); font-weight: 700; }
    button.primary:hover { background: #91e2d0; }
    button.ghost { background: transparent; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
    [hidden] { display: none !important; }

    .gate {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 18% 15%, rgba(200,200,200,.07), transparent 34%),
        radial-gradient(ellipse at 88% 82%, rgba(120,120,120,.08), transparent 32%),
        #1b1b1b;
    }
    .gate-content { width: min(100%, 560px); }
    .eyebrow { margin: 0 0 12px; color: var(--teal); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1, h2, h3 { font-family: "Manrope", sans-serif; }
    .gate h1, .picker-content h1 { margin: 0; font-size: 34px; line-height: 1.12; }
    .lead { max-width: 42ch; margin: 14px 0 28px; color: var(--muted); line-height: 1.6; }
    .password-form { display: flex; gap: 10px; }
    .password-form input {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 13px;
      color: var(--ink);
      background: var(--surface);
    }
    .error { min-height: 22px; margin: 10px 0 0; color: var(--danger); font-size: 13px; }
    .app-shell { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      border-bottom: 1px solid var(--line);
      padding: 14px 20px;
      background: #202020;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark { width: 10px; height: 34px; border-radius: 5px; background: var(--teal); }
    .brand h1 { margin: 0; font-size: 18px; }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
    .workspace { flex: 1; min-width: 0; min-height: 0; display: grid; grid-template-columns: minmax(0,1fr) 280px; }
    .graph-wrap { position: relative; min-width: 0; height: 90vh; min-height: 620px; border-right: 1px solid var(--line); }
    #graph { position: absolute; inset: 0; min-width: 0; min-height: 620px; overflow: hidden; background-color: #1e1e1e; }
    .zoom-controls { position: absolute; z-index: 1; top: 14px; right: 14px; display: flex; gap: 6px; }
    .zoom-controls button { min-width: 42px; padding: 0 12px; }
    .detail-panel { min-width: 0; padding: 22px 18px; background: #202020; }
    .detail-panel h2 { margin: 0 0 8px; font-size: 16px; }
    .selection-count { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
    .relation-box { min-height: 120px; border: 1px solid var(--line); border-radius: 8px; padding: 14px; color: #c9d6da; background: var(--surface); font-size: 13px; line-height: 1.55; white-space: pre-line; }
    .legend { display: grid; gap: 10px; margin-top: 22px; color: var(--muted); font-size: 12px; }
    .legend-row { display: flex; align-items: center; gap: 9px; }
    .swatch { width: 22px; height: 3px; border-radius: 2px; background: var(--teal); }
    .swatch.partner { background: var(--rose); }
    .swatch.adoptive { background: var(--gold); }
    .swatch.step { background: #a7b3ba; }
    .status { min-height: 18px; margin-top: 12px; color: var(--muted); font-size: 12px; }

    @media (max-width: 780px) {
      .workspace { grid-template-columns: 1fr; grid-template-rows: minmax(55vh,1fr) auto; }
      .graph-wrap { height: 55vh; min-height: 55vh; border-right: 0; border-bottom: 1px solid var(--line); }
      #graph { min-height: 55vh; }
      .detail-panel { padding: 16px; }
      .detail-panel .legend { grid-template-columns: repeat(2,minmax(0,1fr)); }
    }
    @media (max-width: 520px) {
      .gate h1 { font-size: 29px; }
      .password-form { flex-direction: column; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .toolbar { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <main id="gate" class="gate">
    <section class="gate-content">
      <p class="eyebrow">Árbol genealógico</p>
      <h1>Acceso familiar</h1>
      <p class="lead">Ingresa la contraseña para abrir el árbol genealógico Lepe.</p>
      <form id="password-form" class="password-form">
        <input id="password" type="password" autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña" required>
        <button id="toggle-password" type="button" class="ghost" aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button>
        <button class="primary" type="submit">Continuar</button>
      </form>
      <p id="password-error" class="error" role="alert"></p>
    </section>
  </main>

  <main id="app" class="app-shell" hidden>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div><h1>Árbol genealógico</h1><p>Familia Lepe</p></div>
      </div>
      <div class="toolbar">
        <button id="zoom-out" aria-label="Alejar" title="Alejar">−</button>
        <button id="zoom-in" aria-label="Acercar" title="Acercar">+</button>
        <button id="fit-graph" class="ghost">Ver todo</button>
      </div>
    </header>
    <section class="workspace">
      <div class="graph-wrap">
        <div id="graph" aria-label="Grafo familiar"></div>
      </div>
      <aside class="detail-panel">
        <h2>Relación seleccionada</h2>
        <p id="selection-count" class="selection-count">Selecciona dos personas</p>
        <div id="relationship" class="relation-box" aria-live="polite">Elige dos nodos del árbol para ver cómo se relacionan.</div>
        <div class="legend" aria-label="Tipos de relación">
          <div class="legend-row"><span class="swatch"></span>Padres e hijos</div>
          <div class="legend-row"><span class="swatch partner"></span>Pareja</div>
          <div class="legend-row"><span class="swatch adoptive"></span>Adopción</div>
          <div class="legend-row"><span class="swatch step"></span>Padrastro/madrastra</div>
        </div>
        <p id="graph-status" class="status"></p>
      </aside>
    </section>
  </main>

  <script>
    const ACCESS_PASSWORD = "LepeXD";
    const passwordForm = document.getElementById("password-form");
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("toggle-password");
    const passwordError = document.getElementById("password-error");
    const gate = document.getElementById("gate");
    const app = document.getElementById("app");
    const selectionCount = document.getElementById("selection-count");
    const relationshipBox = document.getElementById("relationship");
    const graphStatus = document.getElementById("graph-status");
    let graph = null;
    let familyData = null;
    let selectedIds = [];
    const graphResizeObserver = new ResizeObserver(() => {
      if (graph) graph.resize();
    });
    graphResizeObserver.observe(document.getElementById("graph"));
    window.addEventListener("resize", () => {
      if (graph) graph.resize();
    });

    togglePassword.addEventListener("click", () => {
      const mostrar = passwordInput.type === "password";
      passwordInput.type = mostrar ? "text" : "password";
      togglePassword.textContent = mostrar ? "Ocultar" : "Mostrar";
      togglePassword.setAttribute("aria-label", `${mostrar ? "Ocultar" : "Mostrar"} contraseña`);
      togglePassword.setAttribute("aria-pressed", String(mostrar));
      passwordInput.focus();
    });

    passwordForm.addEventListener("submit", async event => {
      event.preventDefault();
      if (passwordInput.value.trim().toLocaleLowerCase() !== ACCESS_PASSWORD.toLocaleLowerCase()) {
        passwordError.textContent = "La contraseña no es correcta.";
        passwordInput.select();
        return;
      }
      passwordError.textContent = "";
      passwordInput.value = "";
      gate.hidden = true;
      app.hidden = false;
      await openFamily();
    });

    document.getElementById("zoom-in").addEventListener("click", () => {
      if (graph) graph.zoom({ level: Math.min(3, graph.zoom() * 1.25), renderedPosition: { x: graph.width() / 2, y: graph.height() / 2 } });
    });
    document.getElementById("zoom-out").addEventListener("click", () => {
      if (graph) graph.zoom({ level: Math.max(0.15, graph.zoom() * 0.8), renderedPosition: { x: graph.width() / 2, y: graph.height() / 2 } });
    });
    document.getElementById("fit-graph").addEventListener("click", () => graph && graph.fit(undefined, 36));

    async function openFamily() {
      try {
        const response = await fetch(new URL("data/lepe.json", document.baseURI));
        if (!response.ok) throw new Error("No se pudo cargar el archivo familiar.");
        familyData = await response.json();
        renderGraph();
      } catch (error) {
        app.hidden = true;
        gate.hidden = false;
        passwordError.textContent = `${error.message} Comprueba que data/lepe.json esté publicado.`;
      }
    }

    function fallbackPosition(person, index) {
      if (person.posicion && Number.isFinite(person.posicion.x) && Number.isFinite(person.posicion.y)) return person.posicion;
      return { x: 120 + (index % 6) * 130, y: 120 + Math.floor(index / 6) * 130 };
    }

    function makeElements(data) {
      const people = data.personas;
      const nodes = people.map((person, index) => ({
        data: {
          id: person.id,
          label: [person.nombre, person.apellido_paterno, person.apellido_materno].filter(Boolean).join(" "),
          genero: person.genero || ""
        },
        position: fallbackPosition(person, index)
      }));
      const parentRelations = data.relaciones.filter(relation =>
        ["biologico", "adoptivo", "padrastro"].includes(relation.tipo)
      );
      const parentsByChild = new Map();
      parentRelations.forEach(relation => {
        if (!parentsByChild.has(relation.destino)) parentsByChild.set(relation.destino, new Map());
        parentsByChild.get(relation.destino).set(`${relation.origen}\u0000${relation.tipo}`, {
          id: relation.origen,
          type: relation.tipo
        });
      });

      const compareText = (first, second) => first < second ? -1 : first > second ? 1 : 0;
      const compareParentSets = (first, second) => {
        for (let index = 0; index < Math.min(first.length, second.length); index += 1) {
          const idOrder = compareText(first[index].id, second[index].id);
          if (idOrder) return idOrder;
          const typeOrder = compareText(first[index].type, second[index].type);
          if (typeOrder) return typeOrder;
        }
        return first.length - second.length;
      };
      const groupsByKey = new Map();
      parentsByChild.forEach((parents, childId) => {
        const sortedParents = [...parents.values()].sort((first, second) =>
          compareText(first.id, second.id) || compareText(first.type, second.type)
        );
        const key = JSON.stringify(sortedParents);
        if (!groupsByKey.has(key)) groupsByKey.set(key, { parents: sortedParents, children: [] });
        groupsByKey.get(key).children.push(childId);
      });

      const familyGroups = [...groupsByKey.values()].sort((first, second) =>
        compareParentSets(first.parents, second.parents)
      );
      const positionsById = new Map(nodes.map(node => [node.data.id, node.position]));
      const edges = [];

      familyGroups.forEach((family, index) => {
        const children = family.children.sort(compareText);
        if (children.length > 1) {
          const typeCounts = new Map();
          family.parents.forEach(parent => typeCounts.set(parent.type, (typeCounts.get(parent.type) || 0) + 1));
          let dominantType = family.parents[0]?.type || "biologico";
          typeCounts.forEach((count, type) => {
            if (count > (typeCounts.get(dominantType) || 0)) dominantType = type;
          });

          const familyId = `fam-${index}`;
          const parentPositions = family.parents.map(parent => positionsById.get(parent.id)).filter(Boolean);
          const childPositions = children.map(childId => positionsById.get(childId)).filter(Boolean);
          nodes.push({
            data: { id: familyId, label: "" },
            classes: "nodo-familia",
            position: {
              x: parentPositions.reduce((sum, position) => sum + position.x, 0) / parentPositions.length,
              y: (Math.max(...parentPositions.map(position => position.y)) + Math.min(...childPositions.map(position => position.y))) / 2
            }
          });

          family.parents.forEach(parent => edges.push({
            data: { id: `${familyId}-p-${parent.id}`, source: parent.id, target: familyId },
            classes: `${dominantType} entra-familia`
          }));
          children.forEach(childId => edges.push({
            data: { id: `${familyId}-h-${childId}`, source: familyId, target: childId },
            classes: dominantType
          }));
        } else {
          children.forEach(childId => family.parents.forEach(parent => edges.push({
            data: { id: `pc-${parent.id}-${childId}`, source: parent.id, target: childId },
            classes: parent.type
          })));
        }
      });
      data.relaciones.filter(relation => relation.tipo === "pareja").forEach(relation => edges.push({
        data: { id: relation.id, source: relation.origen, target: relation.destino },
        classes: "pareja"
      }));

      return { nodes, edges };
    }

    function relationLabel(relation, fromId) {
      if (relation.tipo === "pareja") return "pareja de";
      if (relation.tipo === "biologico") return fromId === relation.origen ? "padre/madre biológico de" : "hijo/a biológico de";
      if (relation.tipo === "adoptivo") return fromId === relation.origen ? "padre/madre adoptivo de" : "hijo/a adoptivo de";
      if (relation.tipo === "padrastro") return fromId === relation.origen ? "padrastro/madrastra de" : "hijastro/a de";
      return relation.tipo;
    }

    function describeConnection(firstId, secondId) {
      const people = new Map(familyData.personas.map(person => [person.id, person]));
      const name = id => [people.get(id)?.nombre, people.get(id)?.apellido_paterno, people.get(id)?.apellido_materno].filter(Boolean).join(" ");
      const direct = familyData.relaciones.filter(relation =>
        (relation.origen === firstId && relation.destino === secondId) ||
        (relation.origen === secondId && relation.destino === firstId)
      );
      if (direct.length) {
        return direct.map(relation => {
          const fromId = relation.origen, toId = relation.destino;
          if (relation.tipo === "pareja") return `${name(fromId)} y ${name(toId)} son pareja.`;
          return `${name(fromId)} es ${relationLabel(relation, fromId)} ${name(toId)}.`;
        }).join("\n");
      }

      const parents = id => new Set(familyData.relaciones
        .filter(relation => relation.destino === id && ["biologico", "adoptivo"].includes(relation.tipo))
        .map(relation => relation.origen));
      const sharedParents = [...parents(firstId)].filter(parentId => parents(secondId).has(parentId));
      if (sharedParents.length) {
        const type = sharedParents.length > 1 ? "hermanos completos" : "medios hermanos";
        return `${name(firstId)} y ${name(secondId)} son ${type}.`;
      }

      const adjacency = new Map(familyData.personas.map(person => [person.id, []]));
      familyData.relaciones.forEach(relation => {
        adjacency.get(relation.origen)?.push({ id: relation.destino, relation });
        adjacency.get(relation.destino)?.push({ id: relation.origen, relation });
      });
      const queue = [[firstId, []]], visited = new Set([firstId]);
      while (queue.length) {
        const [current, path] = queue.shift();
        if (current === secondId) {
          return `Conexión indirecta:\n${path.join("\n")}`;
        }
        for (const neighbor of adjacency.get(current) || []) {
          if (visited.has(neighbor.id)) continue;
          visited.add(neighbor.id);
          const label = relationLabel(neighbor.relation, current);
          queue.push([neighbor.id, [...path, `${name(current)} — ${label} → ${name(neighbor.id)}`]]);
        }
      }
      return "No hay una relación registrada que conecte a estas dos personas en esta vista.";
    }

    function renderSelection() {
      selectionCount.textContent = `${selectedIds.length} de 2 personas seleccionadas`;
      if (selectedIds.length < 2) {
        relationshipBox.textContent = "Selecciona dos nodos del árbol para ver cómo se relacionan.";
        return;
      }
      relationshipBox.textContent = describeConnection(selectedIds[0], selectedIds[1]);
    }

    function renderGraph() {
      const { nodes, edges } = makeElements(familyData);
      if (graph) graph.destroy();
      graph = cytoscape({
        container: document.getElementById("graph"),
        elements: [...nodes, ...edges],
        layout: { name: "preset", fit: true, padding: 36 },
        minZoom: 0.1,
        maxZoom: 3,
        wheelSensitivity: 0.2,
        boxSelectionEnabled: true,
        selectionType: "additive",
        style: [
          { selector: "node", style: { "shape": "rectangle", "label": "data(label)", "text-wrap": "wrap", "text-max-width": 80, "font-size": 12, "text-valign": "center", "text-halign": "center", "color": "#f0f0f0", "background-color": "#7a7a7a", "border-width": 2, "border-color": "#4a4a4a", "width": 55, "height": 55 } },
          { selector: 'node[genero = "M"]', style: { "background-color": "#4a90d9", "border-color": "#2f5f8f" } },
          { selector: 'node[genero = "F"]', style: { "background-color": "#e07bb0", "border-color": "#a8477f" } },
          { selector: "node:selected", style: { "border-width": 4, "border-color": "#ff5722" } },
          { selector: "node.nodo-familia", style: { "shape": "ellipse", "width": 1, "height": 1, "background-opacity": 0, "border-width": 0, "label": "", "events": "no" } },
          { selector: "edge", style: { "curve-style": "taxi", "taxi-direction": "vertical", "taxi-turn": "50%", "taxi-turn-min-distance": "10px", "width": 1.5, "opacity": 0.72 } },
          { selector: "edge.biologico", style: { "line-color": "#2b7a78", "target-arrow-color": "#2b7a78", "target-arrow-shape": "triangle" } },
          { selector: "edge.pareja", style: { "line-color": "#a83279", "target-arrow-shape": "none", "taxi-direction": "horizontal" } },
          { selector: "edge.adoptivo", style: { "line-color": "#c9a227", "line-style": "dashed", "target-arrow-color": "#c9a227", "target-arrow-shape": "triangle" } },
          { selector: "edge.padrastro", style: { "line-color": "#aaaaaa", "line-style": "dotted", "target-arrow-color": "#aaaaaa", "target-arrow-shape": "triangle" } },
          { selector: "edge.entra-familia", style: { "target-arrow-shape": "none" } },
        ]
      });
      selectedIds = [];
      renderSelection();
      graphStatus.textContent = `${familyData.personas.length} personas · ${familyData.relaciones.length} relaciones registradas`;
      graph.on("tap", "node", event => {
        const id = event.target.id();
        selectedIds = selectedIds.includes(id)
          ? selectedIds.filter(selected => selected !== id)
          : [...selectedIds, id].slice(-2);
        graph.nodes().unselect();
        selectedIds.forEach(selected => graph.getElementById(selected).select());
        renderSelection();
      });
    }
  </script>
</body>
</html>
